<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-label="AI Full-Stack Engineer: Agentic AI, Python, TypeScript, Berlin" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>AI Full-Stack Engineer: Agentic AI, Python, TypeScript, Berlin</title>
<style>
.bx{fill:#121826;stroke:#263042;stroke-width:1.25px}
.lbl{fill:#e6edf3;font-size:20px;font-weight:600}
.cap{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:11px;letter-spacing:.14em;fill:#7d8590}
.ln{fill:none;stroke:#3a4556;stroke-width:1.5;stroke-linecap:round}
.lb{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:12px;fill:#7d8590;letter-spacing:.06em}
</style>
<defs>
<pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1a2130"/></pattern>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4b5768" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="330" rx="16" fill="#0b0f17"/>
<rect width="1200" height="330" fill="url(#d)"/>

<!-- title, top right -->
<text x="1144" y="84" text-anchor="end" font-size="44" font-weight="700" fill="#f0f3f6" letter-spacing="-.5">AI Full-Stack Engineer</text>
<text x="1144" y="120" text-anchor="end" font-size="20" fill="#8b949e"><tspan fill="#34d399" font-weight="600">Agentic AI</tspan> · Python · TypeScript · Berlin</text>

<!-- lines -->
<path class="ln" d="M442 150V192" marker-end="url(#a)"/>
<path class="ln" d="M196 232H368" marker-end="url(#a)"/>
<path class="ln" d="M512 220H684" marker-end="url(#a)"/>
<text class="lb" x="600" y="210" text-anchor="middle">act</text>
<path d="M688 244H516" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#g)"/>
<text class="lb" x="600" y="264" text-anchor="middle" style="fill:#34d399">observe</text>
<path class="ln" d="M442 268V288Q442 300 454 300H904Q916 300 916 288V244Q916 232 928 232H1000" marker-end="url(#a)"/>
<text class="lb" x="960" y="222" text-anchor="middle">done</text>

<!-- skills -->
<rect class="bx" x="392" y="112" width="100" height="38" rx="10"/>
<text x="442" y="137" text-anchor="middle" font-size="16" fill="#c9d1d9"><tspan fill="#f5c451">⚡</tspan> skills</text>

<!-- boxes -->
<rect class="bx" x="56" y="196" width="140" height="72" rx="12"/>
<text class="cap" x="126" y="222" text-anchor="middle">INPUT</text>
<text class="lbl" x="126" y="250" text-anchor="middle">query</text>

<rect x="372" y="196" width="140" height="72" rx="12" fill="#34d399" opacity=".35" filter="url(#glow)"/>
<rect x="372" y="196" width="140" height="72" rx="12" fill="#0f2a24" stroke="#34d399" stroke-width="1.75"/>
<text class="cap" x="442" y="222" text-anchor="middle" style="fill:#34d399">CORE</text>
<text class="lbl" x="442" y="250" text-anchor="middle" style="fill:#34d399">agent</text>

<rect class="bx" x="688" y="196" width="140" height="72" rx="12"/>
<text class="cap" x="758" y="222" text-anchor="middle" style="fill:#22d3ee">EXECUTION</text>
<text class="lbl" x="758" y="250" text-anchor="middle">tools</text>

<rect class="bx" x="1004" y="196" width="140" height="72" rx="12"/>
<text class="cap" x="1074" y="222" text-anchor="middle">OUTPUT</text>
<text class="lbl" x="1074" y="250" text-anchor="middle">answer</text>

<rect x="1" y="1" width="1198" height="328" rx="15" fill="none" stroke="#21262d" stroke-width="2"/>
</svg>
