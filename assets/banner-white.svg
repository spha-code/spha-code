<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="AI Full-Stack Engineer: Agentic AI, Python, TypeScript, Berlin" font-family="Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision">
<title>AI Full-Stack Engineer: Agentic AI, Python, TypeScript, Berlin</title>
<style>
text{text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.card{fill:#f5f5f7;stroke:#e5e5ea;stroke-width:1px}
.ag{fill:#e8e8ed;stroke:#d2d2d7;stroke-width:1px}
.t{fill:#1d1d1f;font-size:22px;font-weight:600}
.s{fill:#6e6e73;font-size:16px;font-weight:500}
.ln{fill:none;stroke:#c7c7cc;stroke-width:1.5;stroke-linecap:round}
.lb{font-size:15px;font-weight:500;fill:#86868b}
@keyframes q{0%,4%{fill:#e8e8ed}7%,100%{fill:#f5f5f7}}
@keyframes ag{0%,8%{fill:#e8e8ed}10%,14%{fill:#dcdce1}16%,32%{fill:#e8e8ed}34%,37%{fill:#dcdce1}39%,56%{fill:#e8e8ed}58%,61%{fill:#dcdce1}63%,100%{fill:#e8e8ed}}
@keyframes tl{0%,19%{fill:#f5f5f7}21%,25%{fill:#e8e8ed}27%,44%{fill:#f5f5f7}46%,49%{fill:#e8e8ed}51%,100%{fill:#f5f5f7}}
@keyframes an{0%,80%{fill:#f5f5f7}83%,96%{fill:#e8e8ed}99%,100%{fill:#f5f5f7}}
.bq{animation:q 9s linear infinite}.ba{animation:ag 9s linear infinite}.bt{animation:tl 9s linear infinite}.bn{animation:an 9s linear infinite}
@media (prefers-reduced-motion: reduce){.p{display:none}.bq,.ba,.bt,.bn{animation:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#aeaeb2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="flow" d="M141 246H447V234H753V258H447V234H753V258H447V312H904V246H1059"/>
</defs>
<rect width="1200" height="340" rx="20" fill="#ffffff"/><rect x=".5" y=".5" width="1199" height="339" rx="19.5" fill="none" stroke="#e5e5ea"/>

<!-- heading: title and subtitle on one line -->
<text x="56" y="96"><tspan font-size="44" font-weight="700" fill="#1d1d1f">AI Full-Stack Engineer</tspan><tspan dx="28" font-size="23" font-weight="500" fill="#6e6e73">Agentic AI · Python · TypeScript · Berlin</tspan></text>

<!-- lines -->
<path class="ln" d="M447 178V204" marker-end="url(#a)"/>
<path class="ln" d="M226 246H358" marker-end="url(#a)"/>
<path class="ln" d="M532 234H664" marker-end="url(#a)"/>
<text class="lb" x="598" y="223" text-anchor="middle">act</text>
<path class="ln" d="M668 258H536" stroke-dasharray="4 5" marker-end="url(#a)"/>
<text class="lb" x="598" y="281" text-anchor="middle">observe</text>
<path class="ln" d="M447 282V300Q447 312 459 312H892Q904 312 904 300V258Q904 246 916 246H970" marker-end="url(#a)"/>
<text class="lb" x="938" y="235" text-anchor="middle">done</text>

<!-- moving dot (drawn under the cards) -->
<circle class="p" r="5" fill="#0071e3"><animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"><mpath href="#flow"/></animateMotion></circle>

<!-- skills -->
<rect class="card" x="392" y="140" width="110" height="38" rx="12"/>
<text x="447" y="165" text-anchor="middle" font-size="18" font-weight="500" fill="#3a3a3c">skills</text>

<!-- cards: title + description, like menu items -->
<rect class="card bq" x="56" y="210" width="170" height="72" rx="16"/>
<text class="t" x="76" y="242">query</text>
<text class="s" x="76" y="267">your request</text>

<rect class="ag ba" x="362" y="210" width="170" height="72" rx="16"/>
<text class="t" x="382" y="242">agent</text>
<text class="s" x="382" y="267">plans and decides</text>
<path d="M500 236l6 6 11-13" fill="none" stroke="#0071e3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

<rect class="card bt" x="668" y="210" width="170" height="72" rx="16"/>
<text class="t" x="688" y="242">tools</text>
<text class="s" x="688" y="267">search · APIs · MCP</text>

<rect class="card bn" x="974" y="210" width="170" height="72" rx="16"/>
<text class="t" x="994" y="242">answer</text>
<text class="s" x="994" y="267">final response</text>
</svg>
